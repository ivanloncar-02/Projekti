<mat-toolbar>
  <span class="app-name">Fitness Challenge</span>
  <span class="spacer"></span>

  @if (isMobileNav().matches) {
    <button mat-icon-button [matMenuTriggerFor]="navMenu" aria-label="Open navigation menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #navMenu="matMenu">
      <a mat-menu-item routerLink="/leaderboard" routerLinkActive="active-link">Leaderboard</a>
      <a mat-menu-item [routerLink]="dashboardLink()" [class.active-link]="isDashboardActive()">
        Dashboard
      </a>
      <a mat-menu-item routerLink="/activities/new" routerLinkActive="active-link">Log activity</a>
      <a mat-menu-item routerLink="/users/new" routerLinkActive="active-link">Register user</a>
      <button mat-menu-item (click)="toggleTheme()">
        <mat-icon>{{ themeMode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>{{ themeMode() === 'dark' ? 'Light mode' : 'Dark mode' }}</span>
      </button>
    </mat-menu>
  } @else {
    <nav class="nav-links">
      <a mat-button routerLink="/leaderboard" routerLinkActive="active-link">Leaderboard</a>
      <a mat-button [routerLink]="dashboardLink()" [class.active-link]="isDashboardActive()">
        Dashboard
      </a>
      <a mat-button routerLink="/activities/new" routerLinkActive="active-link">Log activity</a>
      <a mat-button routerLink="/users/new" routerLinkActive="active-link">Register user</a>
    </nav>
    <button
      mat-icon-button
      (click)="toggleTheme()"
      [attr.aria-label]="themeMode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <mat-icon>{{ themeMode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>
