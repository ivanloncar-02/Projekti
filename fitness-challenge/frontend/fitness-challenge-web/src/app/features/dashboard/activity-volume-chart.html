<app-chart-card title="Activity volume over time">
  <div chartControls class="volume-controls">
    <mat-button-toggle-group [value]="metric()" (change)="onMetricChange($event)" aria-label="Chart metric">
      <mat-button-toggle value="points">Points</mat-button-toggle>
      <mat-button-toggle value="distanceKm">Km</mat-button-toggle>
      <mat-button-toggle value="minutes">Minutes</mat-button-toggle>
    </mat-button-toggle-group>

    <mat-button-toggle-group [value]="rangeWindowDays()" (change)="onRangeChange($event)" aria-label="Date range">
      <mat-button-toggle [value]="7">7 days</mat-button-toggle>
      <mat-button-toggle [value]="30">30 days</mat-button-toggle>
      <mat-button-toggle [value]="90">90 days</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <canvas baseChart type="bar" [data]="chartData()" [options]="chartOptions()"></canvas>

  <span chartSummary>{{ summary() }}</span>
</app-chart-card>
