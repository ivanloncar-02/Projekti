services:
  postgres:
    image: postgres:16-alpine
    container_name: agile-mijau-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agile-mijau-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agile-mijau-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '${PGADMIN_PORT}:80'
    depends_on:
      - postgres
    networks:
      - agile-mijau-network

volumes:
  postgres_data:

networks:
  agile-mijau-network:
    driver: bridge
