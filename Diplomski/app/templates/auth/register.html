{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #222; margin-bottom: 20px;">ZTP Sustav - Registracija</h2>
    <p id="auth-message" style="color: red; font-weight: bold; text-align: center;"></p>

    <form id="register-form">
        <label>Email adresa:</label><br>
        <input type="email" id="register-email" required style="width: 100%; padding: 10px; margin: 8px 0 20px 0; box-sizing: border-box;"><br>
        
        <label>Lozinka (min. 6 znakova):</label><br>
        <input type="password" id="register-password" required style="width: 100%; padding: 10px; margin: 8px 0 20px 0; box-sizing: border-box;"><br>
        
        <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Stvori račun</button>
    </form>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    <p style="text-align: center; margin: 0;">Već imate račun? <a href="/auth/login" style="color: #007bff; text-decoration: none; font-weight: bold;">Prijavite se ovdje</a></p>
</div>
{% endblock %}
